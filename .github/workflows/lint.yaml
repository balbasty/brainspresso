name: Lint and spellcheck

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
      python-version:
        description: Python version
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string
      python-version:
        description: Python version
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Python ${{ inputs.python-version || '3.12' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.12' }}
      - name: Install ruff
        run: pip install ruff
      # Rules and line length are configured in pyproject.toml
      - name: Ruff check
        run: ruff check --output-format=github .

  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: Spellcheck
        uses: codespell-project/actions-codespell@v2
        with:
          # Same settings as [tool.codespell] in pyproject.toml
          skip: "*.git,*.pdf,*.lock,*/templates/*,*/lut/*"
          ignore_words_file: codespell-ignore-words.txt
