name: Run matrix of tests

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (python_requires) and newest released Python
        python-version: ["3.11", "3.14"]
        cyclopts-version: [""]
        include:
          # The floor of setup.cfg (`cyclopts >= 5.1`, which needs Python
          # 3.11: roast `--json`, see setup.cfg)
          - python-version: "3.11"
            cyclopts-version: "5.1.0"
    uses: ./.github/workflows/test.yaml
    with:
      tag: ${{ inputs.tag }}
      python-version: ${{ matrix.python-version }}
      cyclopts-version: ${{ matrix.cyclopts-version }}
