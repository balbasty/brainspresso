name: Run matrix of tests

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (python_requires) and newest released Python
        python-version: ["3.10", "3.14"]
        os: [ubuntu-24.04]
        cyclopts-version: [""]
        include:
          # The floor of setup.cfg (`cyclopts >= 3.17`)
          - python-version: "3.10"
            os: ubuntu-24.04
            cyclopts-version: "3.17.0"
          # Other platforms (locks: `LockFileEx` on Windows, classic
          # `fcntl` on macOS; OFD locks on Linux), one Python version each
          - python-version: "3.12"
            os: windows-latest
          - python-version: "3.12"
            os: macos-latest
    uses: ./.github/workflows/test.yaml
    with:
      tag: ${{ inputs.tag }}
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}
      cyclopts-version: ${{ matrix.cyclopts-version }}
