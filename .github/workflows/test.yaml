name: Run tests

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
      python-version:
        description: Python version
        required: true
        default: "3.12"
      cyclopts-version:
        description: "cyclopts version to pin (default: the latest)"
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string
      python-version:
        description: Python version
        required: true
        type: string
      cyclopts-version:
        description: "cyclopts version to pin (default: the latest)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  tests:
    # Pinned (rather than ubuntu-latest) so that setup-python provides
    # every Python version of the matrix, including the oldest one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: setup.cfg
      - name: Install package and test dependencies
        shell: bash
        # Regular (non-editable) install: the tests run against what
        # users get with `pip install`, so files missing from the
        # package make the tests fail.
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          if [ -n "${{ inputs.cyclopts-version }}" ]; then
            pip install "cyclopts==${{ inputs.cyclopts-version }}"
          fi
      - name: Check the CLI
        shell: bash
        run: bx --help
      - name: Test with pytest
        shell: bash
        # Run from outside the checkout so that `import brainspresso`
        # resolves to the installed package, not to the source tree.
        # Tests run in parallel, one process per CPU.
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import brainspresso; print(brainspresso.__file__)"
          pytest "$GITHUB_WORKSPACE/tests" -n auto
