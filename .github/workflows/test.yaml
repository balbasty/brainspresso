name: Run tests

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
      python-version:
        description: Python version
        required: true
        default: "3.12"
      cyclopts-version:
        description: "cyclopts version to pin (default: the latest)"
        required: false
        default: ""
      fasteners-version:
        description: "fasteners version to pin (default: the latest)"
        required: false
        default: ""
      os:
        description: Runner (ubuntu-24.04, windows-latest, macos-latest)
        required: false
        default: ubuntu-24.04
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string
      python-version:
        description: Python version
        required: true
        type: string
      cyclopts-version:
        description: "cyclopts version to pin (default: the latest)"
        required: false
        default: ""
        type: string
      fasteners-version:
        description: "fasteners version to pin (default: the latest)"
        required: false
        default: ""
        type: string
      os:
        description: Runner (ubuntu-24.04, windows-latest, macos-latest)
        required: false
        default: ubuntu-24.04
        type: string

permissions:
  contents: read

jobs:
  tests:
    # Linux pinned (rather than ubuntu-latest) so that setup-python
    # provides every Python version of the matrix, including the oldest
    # one; Windows and macOS run one Python version each.
    runs-on: ${{ inputs.os || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: setup.cfg
      - name: Install package and test dependencies
        shell: bash
        # Regular (non-editable) install: the tests run against what
        # users get with `pip install`, so files missing from the
        # package make the tests fail.
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          if [ -n "${{ inputs.cyclopts-version }}" ]; then
            pip install "cyclopts==${{ inputs.cyclopts-version }}"
          fi
          if [ -n "${{ inputs.fasteners-version }}" ]; then
            pip install "fasteners==${{ inputs.fasteners-version }}"
          fi
      - name: Check the CLI
        shell: bash
        run: bx --help
      - name: Test with pytest
        shell: bash
        # Run from outside the checkout so that `import brainspresso`
        # resolves to the installed package, not to the source tree.
        # Tests run in parallel, one process per CPU.
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import brainspresso; print(brainspresso.__file__)"
          pytest "$GITHUB_WORKSPACE/tests" -n auto
      # TEMPORARY (to be removed): loop the dropped-connection tests
      - name: Loop dropped-connection tests (temporary)
        if: ${{ inputs.os == 'windows-latest' }}
        shell: bash
        working-directory: ${{ github.workspace }}/ci_tmp
        run: |
          # CPU load, as during the parallel test suite
          for k in 1 2 3 4; do
            python -c "while True: pass" & done
          for round in 1 2 3; do
            pytest -q -p no:cacheprovider test_stress.py -n auto -rf \
              > out.txt 2>&1 || true
            tail -1 out.txt
            echo "ROUND $round old: $(grep -c '^FAILED.*\[old-' out.txt) failed"
            echo "ROUND $round new: $(grep -c '^FAILED.*\[new-' out.txt) failed"
            grep '^FAILED' out.txt | head -5
          done
          kill $(jobs -p) || true
