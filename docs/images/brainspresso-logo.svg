<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">brainspresso</title>
  <!-- BIDS mark, file and folder glyphs adapted from the BIDS logo (github.com/bids-standard/bids-specification, CC BY 4.0). -->
  <style>
    .ink{fill:#2b1b13} .ink-s{fill:none;stroke:#2b1b13}
    .cream{fill:#f6ecdd} .crema{fill:#c98b4e} .fixed-ink{fill:#2b1b13}
    .coffee{fill:#6b3e26} .foam{fill:#fbf5ec}
    @media (prefers-color-scheme: dark) {
      .ink{fill:#f6ecdd} .ink-s{stroke:#f6ecdd} .cream{fill:#2b1b13}
    }
  </style>
  <defs>
    <mask id="saucer-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M68 206 C68 326 136 402 240 402 C344 402 412 326 412 206 Z" fill="#000" stroke="#000" stroke-width="22" stroke-linejoin="round"/>
      <ellipse cx="240" cy="206" rx="172" ry="96" fill="#000" stroke="#000" stroke-width="22"/>
      <ellipse cx="430" cy="268" rx="40" ry="30" fill="none" stroke="#000" stroke-width="42"/>
    </mask>
    <!-- poured foam: wobbly edges, soft rim, milk spreading in the crema -->
    <filter id="poured" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.024" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G" result="wavy"/>
      <feGaussianBlur in="wavy" stdDeviation="1.0" result="foam"/>
      <feGaussianBlur in="wavy" stdDeviation="4.0" result="spread"/>
      <feComponentTransfer in="spread" result="halo"><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="foam"/></feMerge>
    </filter>
    <radialGradient id="latte" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#d39a5e"/>
      <stop offset=".7" stop-color="#bf7f45"/>
      <stop offset="1" stop-color="#9d5f2f"/>
    </radialGradient>
  </defs>
