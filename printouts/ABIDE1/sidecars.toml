# Conversion table: protocol printout -> BIDS sidecar template.
# Run `python scripts/make_sidecars.py ABIDE1` to regenerate the sidecars.
#
# Each [[sidecar]] entry has:
#   output    path of the sidecar, relative to brainspresso/datasets/ABIDE/I/templates/
#   printout  path of the protocol printout, relative to printouts/ABIDE1
#   select    (optional) protocol selector: 0-based index or name glob
#             (see `p2b list <printout>`); must match exactly one protocol
#   nii       (optional) NIfTI header (relative to printouts/ABIDE1) used to
#             map anatomical directions to voxel axes
#   defaults  (optional) table of BIDS keys used when protocol2bids
#             does not produce them
#   assigns   (optional) table of BIDS keys that override protocol2bids
#   manual    true if no printout is available: the sidecar is kept as is
#   note      (optional) free-text comment
#   previous  (optional) older template (relative to templates/) that a
#             new sidecar is diffed against in report.md/known_issues.md
#
# Mapping: protocol2bids `datasets/convert_ABIDE1.sh` (owner's per-sample
# choice of printout and protocol index). Sites with samples get one
# template folder per sample (`<Site>_<sample>/`, e.g. `MaxMun_a/`), read
# by the roast when the data's site folder/tarball carries that sample;
# otherwise it falls back to the site folder (`<Site>/`).
# `acq-hires_T1w.json` is the high-resolution anatomical of UCLA
# (`anat_hires` in convert_ABIDE1.sh, protocol index 1 of anat.pdf); it is
# not read by the roast yet.


[[sidecar]]
output = "Caltech/T1w.json"
printout = "Caltech/anat.pdf"
nii = "Caltech/nii/anat.nii"

[[sidecar]]
output = "Caltech/bold.json"
printout = "Caltech/rest.pdf"
nii = "Caltech/nii/rest.nii"

[[sidecar]]
output = "CMU_a/bold.json"
printout = "CMU_a/rest.pdf"
select = "0"
nii = "CMU_a/nii/rest.nii"
previous = "CMU/bold.json"

