# Conversion table: protocol printout -> BIDS sidecar template.
# Run `python scripts/make_sidecars.py ABIDE2` to regenerate the sidecars.
#
# Each [[sidecar]] entry has:
#   output    path of the sidecar, relative to brainspresso/datasets/ABIDE/II/templates/
#   printout  path of the protocol printout, relative to printouts/ABIDE2
#   select    (optional) protocol selector: 0-based index or name glob
#             (see `p2b list <printout>`); must match exactly one protocol
#   nii       (optional) NIfTI header (relative to printouts/ABIDE2) used to
#             map anatomical directions to voxel axes
#   defaults  (optional) table of BIDS keys used when protocol2bids
#             does not produce them
#   assigns   (optional) table of BIDS keys that override protocol2bids
#   manual    true if no printout is available: the sidecar is kept as is
#   note      (optional) free-text comment
#
# Mapping: protocol2bids `datasets/convert_ABIDE2.sh`, except where a
# richer vendor export (`*.txt`) exists for the same protocol (BNI_1,
# ETH_1, KUL_3, TCD_1): there the export is kept (see the `note`s).
# Extra templates not read by the roast yet: KKI/1/acq-rc{8,32}chan_*
# (8- and 32-channel head coil acquisitions), NYU/{1,2}/fieldmap.json.

[[sidecar]]
output = "BNI/1/FLAIR.json"
printout = "BNI_1/3DFLAIR.txt"
nii = "BNI_1/nii/FLAIR.nii"
note = "not in convert_ABIDE2.sh; nii fetched from S3 (see README)"

[[sidecar]]
output = "BNI/1/T1w.json"
printout = "BNI_1/anat.txt"
note = "richer vendor export kept (convert_ABIDE2.sh uses scantable.pdf select 0: fewer keys)"
nii = "BNI_1/nii/T1w.nii"

[[sidecar]]
output = "BNI/1/bold.json"
printout = "BNI_1/rest.txt"
note = "richer vendor export kept (convert_ABIDE2.sh uses scantable.pdf select 1: fewer keys)"
nii = "BNI_1/nii/bold.nii"

[[sidecar]]
output = "BNI/1/dwi.json"
printout = "BNI_1/dti.txt"
note = "not in convert_ABIDE2.sh (scantable has no DTI column); vendor export kept"
nii = "BNI_1/nii/dwi.nii"

