# Conversion table: protocol printout -> BIDS sidecar template.
# Run `python scripts/make_sidecars.py CoRR` to regenerate the sidecars.
#
# Each [[sidecar]] entry has:
#   output    path of the sidecar, relative to brainspresso/datasets/CoRR/templates/
#   printout  path of the protocol printout, relative to printouts/CoRR
#   select    (optional) protocol selector: 0-based index or name glob
#             (see `p2b list <printout>`); must match exactly one protocol
#   nii       (optional) NIfTI header (relative to printouts/CoRR) used to
#             map anatomical directions to voxel axes
#   defaults  (optional) table of BIDS keys used when protocol2bids
#             does not produce them
#   assigns   (optional) table of BIDS keys that override protocol2bids
#   fill_from (optional) other printout of the same acquisition (e.g. the
#             site scan table) whose keys fill those missing from the
#             sidecar, as `p2b --fill-from`; never overrides
#   fill_select (optional) protocol selector in `fill_from` (default: 0)
#   manual    true if no printout is available: the sidecar is kept as is
#   note      (optional) free-text comment
#   previous  (optional) older template (relative to templates/) that a
#             new sidecar is diffed against in report.md/known_issues.md
#
# Mapping: protocol2bids `datasets/convert_CoRR.sh` for BMB_1, BNU_1-3,
# IACAS, IPCAS_5, NKI_TRT, NYU_2, UM, Utah_1-2 and XHCUMS; scantables
# elsewhere. Several protocols of one sample use BIDS-like names:
# BNU/2/ses-{1,2}_{T1w,bold}.json (test/retest sessions),
# NKI/TRT/acq-{645,1400,2500}_bold.json (TR in ms), *fieldmap.json.
# CoRR has no roast yet: nothing reads these templates.

