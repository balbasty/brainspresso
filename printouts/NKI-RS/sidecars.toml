# Conversion table: protocol printout -> BIDS sidecar template.
# Run `python scripts/make_sidecars.py NKI-RS` to regenerate the sidecars.
#
# Each [[sidecar]] entry has:
#   output    path of the sidecar, relative to brainspresso/datasets/INDI/templates/nki-rs/
#   printout  path of the protocol printout, relative to printouts/NKI-RS
#   select    (optional) protocol selector: 0-based index or name glob
#             (see `p2b list <printout>`); must match exactly one protocol
#   nii       (optional) NIfTI header (relative to printouts/NKI-RS) used to
#             map anatomical directions to voxel axes
#   defaults  (optional) table of BIDS keys used when protocol2bids
#             does not produce them
#   fill      true: fill-in template. The bucket hosts BIDS sidecars; the
#             roast only fills the keys they lack with this template and
#             never overrides theirs (see printouts/README.md)
#   note      (optional) free-text comment
#
# Outputs are named as the local (remapped) BIDS files, without the
# sub/ses/run entities, so that they apply to every matching file.
# One site (NKI, Siemens TrioTim), RocklandSample/RawDataBIDSLatest.
# The protocol page (indi/enhanced/mri_protocol.html, HTML, not read by
# protocol2bids) links one Siemens printout per scan; the lifespan
# protocol's are used. Four of them are byte-identical to CoRR NKI_TRT
# printouts and are used from printouts/CoRR by reference:
#   DIff_137.pdf == CoRR/NKI_TRT/dti.pdf
#   Rest_645.pdf == CoRR/NKI_TRT/rest_645.pdf
#   Rest_1400.pdf == CoRR/NKI_TRT/rest_1400.pdf
#   Rest_CAP.pdf == CoRR/NKI_TRT/rest_2500.pdf (REST_CAP, TR = 2500 ms)
# No printout for T2w, FLAIR and task-pCASL_bold, nor for
# the `acq-*RR` reruns: no template.

[[sidecar]]
output = "T1w.json"
printout = "NKI_MPRAGE.pdf"
nii = "nii/T1w.nii"
fill = true
note = "MPRAGE, TR = 1900 ms (lifespan protocol)"

[[sidecar]]
output = "dwi.json"
printout = "../CoRR/NKI_TRT/dti.pdf"
nii = "nii/dwi.nii"
fill = true
note = "DIFF_137_AP (NITRC indi/pro/eNKI_RS_TRT/DIff_137.pdf)"

[[sidecar]]
output = "task-rest_acq-645_bold.json"
printout = "../CoRR/NKI_TRT/rest_645.pdf"
nii = "nii/rest_645.nii"
defaults = { TaskName = "rest" }
fill = true
note = "REST_645 (NITRC indi/pro/eNKI_RS_TRT/Rest_645.pdf)"

[[sidecar]]
output = "task-rest_acq-1400_bold.json"
printout = "../CoRR/NKI_TRT/rest_1400.pdf"
nii = "nii/rest_1400.nii"
defaults = { TaskName = "rest" }
fill = true
note = "REST_1400 (NITRC indi/pro/eNKI_RS_TRT/Rest_1400.pdf)"

[[sidecar]]
output = "task-rest_acq-CAP_bold.json"
printout = "../CoRR/NKI_TRT/rest_2500.pdf"
nii = "nii/rest_CAP.nii"
defaults = { TaskName = "rest" }
fill = true
note = "REST_CAP (NITRC indi/pro/eNKI_RS_TRT/Rest_CAP.pdf)"

[[sidecar]]
output = "task-CHECKERBOARD_acq-645_bold.json"
printout = "Checker_645.pdf"
nii = "nii/checker_645.nii"
defaults = { TaskName = "CHECKERBOARD" }
fill = true

[[sidecar]]
output = "task-CHECKERBOARD_acq-1400_bold.json"
printout = "Checker_1400.pdf"
nii = "nii/checker_1400.nii"
defaults = { TaskName = "CHECKERBOARD" }
fill = true

[[sidecar]]
output = "task-BREATHHOLD_acq-1400_bold.json"
printout = "Breath_1400.pdf"
nii = "nii/breathhold_1400.nii"
defaults = { TaskName = "BREATHHOLD" }
fill = true
