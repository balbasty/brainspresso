[build-system]
# Minimum requirements for the build system to execute.
requires = [
    "setuptools",
    "wheel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Docstrings (pydocstyle, numpy convention) are enforced package by
# package, in the packages ported to the new architecture only; extend
# this one (negated) pattern as packages comply (two negated patterns
# would exempt every file): docs/design/architecture.md, "Conventions".
"!brainspresso/{actions/**,bids/**,download/**,roast/**,sources/**,datasets/base.py,datasets/options.py,datasets/catalog.py,datasets/register.py,datasets/compost.py,cli.py,errors.py,__main__.py}" = ["D"]

[tool.codespell]
skip = "*.git,*.pdf,*.lock,*/templates/*,*/lut/*,./build,*.egg-info"
ignore-words = "codespell-ignore-words.txt"

[tool.coverage.run]
source = ["brainspresso"]
