[build-system]
# Minimum requirements for the build system to execute.
requires = [
    "setuptools",
    "wheel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.codespell]
skip = "*.git,*.pdf,*.lock,*/templates/*,*/lut/*,./build,*.egg-info"
ignore-words = "codespell-ignore-words.txt"

[tool.coverage.run]
source = ["brainspresso"]
