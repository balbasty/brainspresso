[metadata]
name = brainspresso
author = Yael Balbastre
author_email = yael.balbastre@gmail.com
description = Download, bidsify and preprocess public datasets
long_description = file:README.md
platforms = OS Independent
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Scientific/Engineering :: Medical Science Apps.
project_urls =
    Source Code=https://github.com/balbasty/brainspresso

[options]
packages = find:
python_requires = >= 3.11
install_requires =
    requests        # HTTP requests
    aiohttp         # Async HTTP requests
    aiofiles        # Async file i/o
    fasteners       # File locks
    # CLI. 5.1: roast `--json [yes|no|only]` / `--no-json`, a
    # `Literal | bool` field of the flattened dataclass groups of
    # `datasets/options.py` (an option that takes 0 or 1 value): 3.17 to
    # 5.0 fail on any `--json` ("Cannot Union types that consume different
    # numbers of tokens", 5.0: a bare `--json`). 5.1 needs Python 3.11.
    # Checked: the whole test suite passes on 5.1.0 and 5.5.3.
    cyclopts >= 5.1
    nibabel         # Neuroimaging formats
    pyout           # Display download status in a nice table
    humanize        # Convert various numbers into human form

[options.packages.find]
include =
    brainspresso
    brainspresso.*

[options.extras_require]
abide1 =
abide2 =
abide =
    brainspresso[abide1]
    brainspresso[abide2]
adhd200 =
adni1 =
adni2 =
adni3 =
adnigo =
adnidod =
adni =
    brainspresso[adni1]
    brainspresso[adni2]
    brainspresso[adni3]
    brainspresso[adnigo]
    brainspresso[adnidod]
cobre =
corr =
gsp =
ixi =
    xlrd            # Excel xls
oasis1 =
    openpyxl        # Excel xlsx
oasis2 =
    openpyxl        # Excel xlsx
oasis3 =
nrrd =
    pynrrd          # NRRD images
unc-wisconsin =
    brainspresso[nrrd]
oasis =
    brainspresso[oasis1]
    brainspresso[oasis2]
    brainspresso[oasis3]
all =
    brainspresso[abide]
    brainspresso[adhd200]
    brainspresso[cobre]
    brainspresso[corr]
    brainspresso[ixi]
    brainspresso[oasis]
    brainspresso[unc-wisconsin]
openneuro =
test =
    pytest
    pytest-cov      # coverage
    pytest-xdist    # parallel tests (`pytest -n auto`)
    brainspresso[all]
mpi-leipzig = brainspresso[openneuro]

[options.package_data]
* =
    freesurfer/lut/*
    utils/schemas/*/*
    datasets/*/templates/*
    datasets/*/templates/*/*
    datasets/*/templates/*/*/*
    datasets/*/templates/*/*/*/*
    datasets/*/templates/*/.bidsignore
    datasets/*/*/templates/*
    datasets/*/*/templates/*/*
    datasets/*/*/templates/*/*/*

[options.entry_points]
console_scripts =
    brainspresso = brainspresso.cli:main
    bx = brainspresso.cli:main
